<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERMASK — IN DEVELOPMENT</title>
    <!-- Подключаем чистый системный шрифт SF Pro (через системные алиасы) и JetBrains Mono для интерфейса -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Обнуление и жесткая швейцарская сетка */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Кастомный моно-курсор nncnc */
        }

        html, body {
            background-color: #000000; /* Идеально черный OLED фон вместо серого */
            color: #ffffff;
            /* Использование оригинального шрифта Apple (SF Pro Display) */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Тонкие премиальные линии-границы в стиле nncnc.app */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 80px 1fr 80px;
            min-height: 100vh;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 24px;
            position: relative;
        }

        /* Навигационная панель / Хэдер */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
        }

        /* Двухцветный блок IN DEVELOPMENT */
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #E583EA; /* Точка первого цвета */
            border-radius: 50%;
        }

        .status-text {
            color: #C69DC8; /* Текст второго цвета */
            font-weight: 500;
        }

        .project-url {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Центрированная композиция с жесткой архитектурой текста (Apple Pro дизайн) */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 80px;
            max-width: 1000px;
        }

        /* Логотип строго по переданным HEX-кодам */
        .logo {
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.04em; /* Фирменное эппловское сжатие букв */
            text-transform: uppercase;
            line-height: 1.0;
            margin-bottom: 56px;
        }

        .logo-under {
            color: #E583EA; /* Первый цвет */
        }

        .logo-mask {
            color: #C69DC8; /* Второй цвет */
        }

        /* Блок манифеста: типографика как на презентациях Mac Studio */
        .manifesto-block {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Сильный, контрастный лозунг */
        .slogan {
            font-size: clamp(1.4rem, 2.8vw, 2.2rem);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.25;
            max-width: 750px;
        }

        /* Ультра-лаконичное описание, отделенное пространством */
        .description {
            font-size: clamp(1rem, 1.8vw, 1.2rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4); /* Эффект приглушенного текста Apple */
            line-height: 1.6;
            letter-spacing: -0.01em;
            max-width: 640px;
        }

        /* Нижняя панель */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.05em;
        }

        /* Кастомный монохромный инвертирующий курсор */
        #custom-cursor {
            width: 10px;
            height: 10px;
            background-color: #E583EA;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: width 0.12s, height 0.12s;
        }

        body.clickable-hover #custom-cursor {
            width: 24px;
            height: 24px;
            background-color: #ffffff;
        }

        /* Адаптивность без ломания сетки */
        @media (max-width: 768px) {
            * { cursor: auto; }
            #custom-cursor { display: none; }
            .grid-layout { margin: 12px; grid-template-rows: 64px 1fr 64px; }
            header, footer { padding: 0 20px; }
            main { padding: 0 24px; }
            .logo { margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div class="grid-layout">
        
        <header>
            <div class="status-container">
                <span class="status-dot"></span>
                <span class="status-text">IN DEVELOPMENT</span>
            </div>
            <div class="project-url">undermask.app</div>
        </header>

        <main>
            <!-- Логотип собран строго на предоставленных HEX кодах -->
            <h1 class="logo" onmouseenter="addHover()" onmouseleave="removeHover()">
                <span class="logo-under">UNDER</span><span class="logo-mask">MASK</span>
            </h1>
            
            <!-- Чистая швейцарская иерархия текста -->
            <div class="manifesto-block">
                <div class="slogan">“You are not statistics — you are a person.”</div>
                <p class="description">
                    A private space designed to reveal your true alignment within society. Remove the mask, answer blindly, and see yourself without the noise of validation.
                </p>
            </div>
        </main>

        <footer>
            <div>[ ZERO DATA HARVESTING ]</div>
            <div>PHASE 0.1</div>
        </footer>

    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function addHover() { document.body.classList.add('clickable-hover'); }
        function removeHover() { document.body.classList.remove('clickable-hover'); }
    </script>
</body>
</html>
